server.port=8092

spring.application.name=socialmedia-api

# Database

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_social?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345678}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=43600000
app.jwt.refresh=86400000